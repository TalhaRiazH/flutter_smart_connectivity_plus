name: flutter_smart_connectivity_plus
description: Offline and flaky-network handling for Flutter. Detect connection loss, show a clear UI, queue actions, and retry safely when the network returns.
version: 0.2.3
homepage: https://github.com/TalhaRiazH/flutter_smart_connectivity_plus
repository: https://github.com/TalhaRiazH/flutter_smart_connectivity_plus
issue_tracker: https://github.com/TalhaRiazH/flutter_smart_connectivity_plus/issues

topics:
  - offline
  - network
  - connectivity
  - retry
  - flutter

platforms:
  android:
  ios:
  web:
  macos:
  windows:
  linux:

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  connectivity_plus: ^7.3.2
  material_ui: ^1.2.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
